name: Qualidade

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: Elavora/.github/.github/workflows/php-quality.yml@2a6cd142f0cd3f1aac93b98d19f561d4f91e169e # 1.3.2

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Subir a API
        run: docker compose up --build --detach

      - name: Conferir /health e /health/show
        shell: bash
        run: |
          set -euo pipefail

          port="$(docker compose port api 8080 | awk -F: '{print $NF}')"
          if [[ ! "$port" =~ ^[0-9]+$ ]]; then
            echo "porta da API não encontrada: '${port}'" >&2
            exit 1
          fi

          health=''
          for _ in $(seq 1 20); do
            if health="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/health")"; then
              break
            fi
            health=''
            sleep 1
          done

          if [[ "$health" != '{"status":"ok"}' ]]; then
            echo "/health respondeu '${health}'" >&2
            docker compose logs api >&2 || true
            exit 1
          fi

          show="$(curl --fail --silent --show-error "http://127.0.0.1:${port}/health/show")"
          if [[ "$show" != '{"status":"ok"}' ]]; then
            echo "/health/show respondeu '${show}'" >&2
            exit 1
          fi

      - name: Derrubar o Compose
        if: always()
        run: docker compose down --volumes --remove-orphans
