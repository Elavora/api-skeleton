name: Sincronizar labels

# Só do repositório Elavora/api-skeleton: removido na criação do projeto.

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'Elavora/api-skeleton'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: Elavora/.github/.github/workflows/sync-labels.yml@d96e9bb606f84016dd031ad748d009d820fd5487 # 1.3.0
