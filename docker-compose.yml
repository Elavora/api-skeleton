services:
  api:
    # Servico minimo da API. Ative overlays opcionais com multiplos argumentos
    # `-f`, por exemplo: docker compose -f docker-compose.yml -f core/compose/redis.yml up
    # Nao copie o conteudo dos overlays para este arquivo.
    build:
      context: .
      dockerfile: Dockerfile
    # `.env` e opcional: sem ele, a aplicacao usa os defaults do codigo.
    # `environment` nos overlays tem precedencia sobre estes valores.
    env_file:
      - path: ${ELAVORA_ENV_FILE:-.env}
        required: false
    ports:
      - "${APP_PORT:-8080}:8080"
